# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
      - shell: bash
        run: |
          sed -i 's/^\.t\.add\[`compat_old_training;{/&'\''"skip: peachq";/' tests/test_core_compat.q
          sed -i 's/^\.t\.add\[`bulk_follow_up;{/&'\''"skip: peachq";/' projects/gw/tests/test_bulk.q
          sed -i 's/^\.t\.add\[`gw_mf_baseline;{/&'\''"skip: peachq";/' projects/gw/tests/test_gw.q
          $QCMD tests/run.q -classic < /dev/null | tee out.txt
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(tail -1 out.txt)" >> "$GITHUB_STEP_SUMMARY"
